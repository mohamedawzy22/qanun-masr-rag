repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]

      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: Run test suite
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true