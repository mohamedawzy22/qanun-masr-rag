name: CD - Build, Smoke Test, and Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================
  # JOB 1: Build the Docker image without publishing it.
  # ==========================================================
  build_image:
    name: 1. Build Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_name: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout the commit pushed to main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qanun-masr-rag-api" >> "$GITHUB_OUTPUT"

      - name: Build image locally without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export the image for downstream jobs
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: docker save --output image.tar "$IMAGE"

      - name: Upload built image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-api-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ==========================================================
  # JOB 2: Run the actual container and verify its health.
  # This job starts only after the image build has succeeded.
  # ==========================================================
  smoke_test:
    name: 2. Smoke Test Container
    runs-on: ubuntu-latest
    needs: build_image

    steps:
      - name: Download the built image
        uses: actions/download-artifact@v4
        with:
          name: rag-api-image-${{ github.sha }}
          path: ./image-artifact

      - name: Load the built image
        run: docker load --input ./image-artifact/image.tar

      - name: Set up Python for environment parsing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dotenv parser
        run: python -m pip install --disable-pip-version-check --no-input python-dotenv

      - name: Smoke-test the built API image
        shell: bash
        env:
          ENV_APP: ${{ secrets.ENV_APP }}
          IMAGE: ${{ needs.build_image.outputs.image_name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${ENV_APP:-}" ]]; then
            echo "::error::Repository secret ENV_APP is missing."
            exit 1
          fi

          smoke_dir="$(mktemp -d)"
          chmod 700 "$smoke_dir"

          env_file="$smoke_dir/app.env"
          health_file="$smoke_dir/health.json"
          container_name="rag-api-smoke-${GITHUB_RUN_ID}"

          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT

          umask 077
          printf '%s\n' "$ENV_APP" > "$env_file"
          unset ENV_APP

          export SMOKE_ENV_FILE="$env_file"
          export SMOKE_CONTAINER_NAME="$container_name"

          # Parse the environment file with python-dotenv.
          # Pass variable names to Docker, while their values stay out
          # of command-line arguments.
          python - <<'PY'
          import os
          import re
          import subprocess
          from dotenv import dotenv_values

          values = dotenv_values(
              os.environ["SMOKE_ENV_FILE"],
              interpolate=False,
          )

          env_values = {}

          for key, value in values.items():
              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                  raise SystemExit(
                      "Invalid environment variable name in ENV_APP."
                  )

              if value is None:
                  raise SystemExit(
                      f"Environment variable {key} has no value."
                  )

              env_values[key] = value

          if not env_values:
              raise SystemExit(
                  "ENV_APP contains no usable environment variables."
              )

          docker_env = os.environ.copy()
          docker_env.pop("SMOKE_ENV_FILE", None)
          docker_env.pop("SMOKE_CONTAINER_NAME", None)

          for key, value in env_values.items():
              docker_env[key] = value

          command = [
              "docker",
              "run",
              "--detach",
              "--name",
              os.environ["SMOKE_CONTAINER_NAME"],
              "--publish",
              "127.0.0.1:18001:8001",
          ]

          for key in env_values:
              command.extend(["--env", key])

          command.extend(
              [
                  os.environ["IMAGE"],
                  "uvicorn",
                  "main:app",
                  "--app-dir",
                  "/app/src",
                  "--host",
                  "0.0.0.0",
                  "--port",
                  "8001",
                  "--lifespan",
                  "off",
              ]
          )

          subprocess.run(
              command,
              check=True,
              env=docker_env,
              stdout=subprocess.DEVNULL,
          )

          print("Smoke-test container started.")
          PY

          healthy=0

          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:18001/api/v1/health \
              --output "$health_file" 2>/dev/null; then

              if python -c \
                'import json,sys; p=json.load(open(sys.argv[1])); sys.exit(0 if p.get("API_Name") == "rag-system" and p.get("API_Version") else 1)' \
                "$health_file"; then
                healthy=1
                break
              fi
            fi

            sleep 2
          done

          if [[ "$healthy" -ne 1 ]]; then
            echo "::error::Smoke test failed: /api/v1/health did not return the expected API payload."

            docker inspect "$container_name" \
              --format 'Container status: {{.State.Status}}' || true

            docker logs --tail=80 "$container_name" || true
            exit 1
          fi

          echo "Smoke test passed: API name and version verified."

  # ==========================================================
  # JOB 3: Publish the exact image that passed the smoke test.
  # This job cannot start unless build_image and smoke_test pass.
  # ==========================================================
  publish:
    name: 3. Publish Verified Image to GHCR
    runs-on: ubuntu-latest
    needs:
      - build_image
      - smoke_test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the smoke-tested image
        uses: actions/download-artifact@v4
        with:
          name: rag-api-image-${{ github.sha }}
          path: ./image-artifact

      - name: Load the smoke-tested image
        run: docker load --input ./image-artifact/image.tar

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qanun-masr-rag-api" >> "$GITHUB_OUTPUT"

      - name: Tag the exact tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:sha-${COMMIT_SHA}" "${IMAGE}:latest"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the smoke-tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:sha-${COMMIT_SHA}"
          docker push "${IMAGE}:latest"
