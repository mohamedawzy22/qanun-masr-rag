name: CD - Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Build, smoke-test, and publish API image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the commit pushed to main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qanun-masr-rag-api" >> "$GITHUB_OUTPUT"

      - name: Build image locally without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built API image
        shell: bash
        env:
          ENV_APP: ${{ secrets.ENV_APP }}
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${ENV_APP:-}" ]]; then
            echo "::error::Repository secret ENV_APP is missing."
            exit 1
          fi

          smoke_dir="$(mktemp -d)"
          chmod 700 "$smoke_dir"

          env_file="$smoke_dir/app.env"
          compose_file="$smoke_dir/compose.yaml"
          health_file="$smoke_dir/health.json"
          compose_project="rag-smoke-${GITHUB_RUN_ID}"

          cleanup() {
            docker compose \
              -p "$compose_project" \
              -f "$compose_file" \
              down --timeout 1 >/dev/null 2>&1 || true

            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT

          printf '%s\n' "$ENV_APP" > "$env_file"
          chmod 600 "$env_file"
          unset ENV_APP

          cat > "$compose_file" <<EOF
          services:
            api:
              image: "${IMAGE}"
              env_file:
                - ./app.env
              ports:
                - "127.0.0.1:18001:8001"
          EOF

          docker compose \
            -p "$compose_project" \
            -f "$compose_file" \
            up -d --no-build

          healthy=0

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:18001/api/v1/health \
              --output "$health_file" 2>/dev/null; then

              if python -c \
                'import json,sys; p=json.load(open(sys.argv[1])); sys.exit(0 if p.get("API_Name") == "rag-system" and p.get("API_Version") else 1)' \
                "$health_file"; then
                healthy=1
                break
              fi
            fi

            sleep 2
          done

          if [[ "$healthy" -ne 1 ]]; then
            echo "::error::Docker smoke test failed: health endpoint did not return the expected API payload."

            docker compose \
              -p "$compose_project" \
              -f "$compose_file" \
              ps || true

            docker compose \
              -p "$compose_project" \
              -f "$compose_file" \
              logs --no-color --tail=80 api || true

            exit 1
          fi

          echo "Docker smoke test passed: API name and version verified."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the smoke-tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:sha-${COMMIT_SHA}"
          docker push "${IMAGE}:latest"
