name: CD - Build, Stage, and Publish Candidate

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_image:
    name: 1. Build Candidate Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_name: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qanun-masr-rag-api" >> "$GITHUB_OUTPUT"

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image for downstream jobs
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: docker save --output image.tar "$IMAGE"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-api-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  smoke_test:
    name: 2. Fast Container Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build_image

    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: rag-api-image-${{ github.sha }}
          path: ./image-artifact

      - name: Load built image
        run: docker load --input ./image-artifact/image.tar

      - name: Test container and health endpoint
        env:
          IMAGE: ${{ needs.build_image.outputs.image_name }}:sha-${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          smoke_dir="$(mktemp -d)"
          env_file="$smoke_dir/smoke.env"
          health_file="$smoke_dir/health.json"
          container_name="rag-smoke-${GITHUB_RUN_ID}"
          umask 077

          cleanup() {
            local exit_code=$?
            trap - EXIT
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            rm -rf "$smoke_dir"
            exit "$exit_code"
          }
          trap cleanup EXIT

          # No production secrets or external services are used in this fast test.
          cat > "$env_file" <<'ENV'
          APP_NAME=rag-system
          APP_VERSION=smoke-test
          LOG_LEVEL=INFO
          FILE_ALLOWED_TYPES=["application/pdf","text/plain"]
          FILE_MAX_SIZE=10
          FILE_DEFAULT_CHUNK_SIZE=512
          MINIO_ACCESS_KEY=smoke-access
          MINIO_SECRET_KEY=smoke-secret
          MONGODB_URL=mongodb://localhost:27017
          MONGODB_DATABASE=smoke_test
          CHAT_MODELS={"smoke-primary":{"provider":"ollama","model":"unused"},"smoke-fallback":{"provider":"ollama","model":"unused"}}
          CHAT_PRIMARY_MODEL=smoke-primary
          CHAT_FALLBACK_MODEL=smoke-fallback
          EMBEDDING_MODELS={"smoke-embedding":{"provider":"ollama","model":"unused","dimension":384}}
          EMBEDDING_MODEL=smoke-embedding
          QDRANT_URL=http://localhost:6333
          QDRANT_COLLECTION_NAME=smoke-test
          QDRANT_VECTOR_SIZE=384
          QDRANT_DISTANCE=cosine
          ENV

          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:18001:8001 \
            --env-file "$env_file" \
            "$IMAGE" \
            uvicorn main:app \
              --app-dir /app/src \
              --host 0.0.0.0 \
              --port 8001 \
              --lifespan off >/dev/null

          healthy=0
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --fail --silent --max-time 3 \
              http://127.0.0.1:18001/api/v1/health \
              --output "$health_file"; then
              if python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as file:
              payload = json.load(file)
          sys.exit(0 if payload.get("API_Name") == "rag-system" and payload.get("API_Version") == "smoke-test" else 1)
          ' "$health_file"; then
                healthy=1
                break
              fi
            fi
            sleep 2
          done

          if [[ "$healthy" -ne 1 ]]; then
            echo "::error::Fast smoke test failed."
            docker logs --tail=100 "$container_name" || true
            exit 1
          fi

          echo "Fast smoke test passed."

  staging_integration:
    name: 3. Ephemeral Staging Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build_image

    steps:
      - name: Checkout integration test script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: rag-api-image-${{ github.sha }}
          path: ./image-artifact

      - name: Load built image
        run: docker load --input ./image-artifact/image.tar

      - name: Run full-startup integration test
        env:
          IMAGE: ${{ needs.build_image.outputs.image_name }}:sha-${{ github.sha }}
        run: bash .github/scripts/integration-test.sh

  publish_candidate:
    name: 4. Publish Tested Candidate to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build_image
      - smoke_test
      - staging_integration

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: rag-api-image-${{ github.sha }}
          path: ./image-artifact

      - name: Load tested image
        run: docker load --input ./image-artifact/image.tar

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qanun-masr-rag-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable candidate tags only
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${COMMIT_SHA:0:7}"
          docker tag "${IMAGE}:sha-${COMMIT_SHA}" "${IMAGE}:candidate-${short_sha}"
          docker push "${IMAGE}:sha-${COMMIT_SHA}"
          docker push "${IMAGE}:candidate-${short_sha}"
          {
            echo "## Staging candidate is ready"
            echo
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Immutable image: \`${IMAGE}:sha-${COMMIT_SHA}\`"
            echo "- Candidate tag: \`${IMAGE}:candidate-${short_sha}\`"
            echo
            echo "No production \`latest\` tag was changed. Review this run, then manually start the Promote Tested Image workflow to promote this SHA."
          } >> "$GITHUB_STEP_SUMMARY"
