name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit checks (tests run in the next job)
        env:
          SKIP: pytest
        run: uv run pre-commit run --all-files

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          APP_NAME: qanun-masr-rag-ci
          APP_VERSION: "0.0.0-ci"
          LOG_LEVEL: ERROR

          FILE_ALLOWED_TYPES: '["application/pdf","text/plain"]'
          FILE_MAX_SIZE: "10"
          FILE_DEFAULT_CHUNK_SIZE: "512"

          MINIO_ENDPOINT: "127.0.0.1:9091"
          MINIO_ACCESS_KEY: ci-test-access-key
          MINIO_SECRET_KEY: ci-test-secret-key

          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DATABASE: qanun_masr_ci

          OPENROUTER_API_KEY: ""
          OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
          OLLAMA_BASE_URL: "http://127.0.0.1:11434/v1"

          CHAT_MODELS: '{"ci-primary":{"provider":"ollama","model":"qwen2.5:0.5b"},"ci-fallback":{"provider":"ollama","model":"qwen2.5:0.5b"}}'
          CHAT_PRIMARY_MODEL: ci-primary
          CHAT_FALLBACK_MODEL: ci-fallback
          EMBEDDING_MODELS: '{"ci-embedding":{"provider":"ollama","model":"all-minilm:33m","dimension":384}}'
          EMBEDDING_MODEL: ci-embedding

          QDRANT_URL: "http://127.0.0.1:6333"
          QDRANT_API_KEY: ""
          QDRANT_COLLECTION_NAME: qanun_masr_ci
          QDRANT_VECTOR_SIZE: "384"
          QDRANT_DISTANCE: cosine

          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
          LANGFUSE_BASE_URL: "http://127.0.0.1:3000"
        run: uv run pytest

  docker_build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
