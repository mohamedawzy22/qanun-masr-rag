
[project]
name = "qanun-masr-rag"
version = "0.1.0"
description = "Production-oriented RAG system for Egyptian law"
readme = "README.md"
authors = [
    { name = "Mohamed Fawzy", email = "mohamedawzy400@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    # Core API
    "aiofiles>=25.1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.0,<2.0.0",

    # LangChain 0.3-compatible stack
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-core>=0.3.78,<0.4.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",

    # OpenAI SDK compatible with the selected LangChain integration
    "openai>=2.0.0,<3.0.0",

    # LLM observability
    "langfuse>=4.17.0,<5.0.0",
    "ollama>=0.6.2,<1.0.0",

    # Storage and vector database
    "minio>=7.2.20",
    "pymongo>=4.18.1",
    "qdrant-client==1.14.1",
    "pymupdf>=1.28.2",

    # Monitoring
    "prometheus-client>=0.26.0",
    "ragas==0.4.3",
]

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "httpx>=0.27.0,<1.0.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/controllers --cov=src/services/rag --cov-report=term-missing --cov-fail-under=75"

[tool.ruff.lint]
extend-ignore = ["B008"]
