services:
  # ==========================================================
  # MongoDB
  # Stores RAG application data and metadata.
  # ==========================================================
  mongo:
    image: mongo:8

    ports:
      - "127.0.0.1:27007:27017"

    volumes:
      - mongo_data:/data/db

    env_file:
      - ./env/.env.mongo

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    networks:
      - backend


  # ==========================================================
  # Qdrant
  # Stores vector embeddings for RAG retrieval.
  # ==========================================================
  qdrant:
    image: qdrant/qdrant:v1.13.6

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

    networks:
      - backend



  # ==========================================================
  # Prometheus
  # Collects application and infrastructure metrics.
  # ==========================================================
  prometheus:
    image: prom/prometheus:v3.3.0

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    restart: unless-stopped

    networks:
      - backend
      - monitoring


  # ==========================================================
  # Grafana
  # Visualizes Prometheus metrics.
  # ==========================================================
  grafana:
    image: grafana/grafana:11.6.0-ubuntu

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - ./env/.env.grafana

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped

    depends_on:
      - prometheus

    networks:
      - monitoring


  # ==========================================================
  # Langfuse Worker
  # Processes Langfuse events and background jobs asynchronously.
  # ==========================================================
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4

    env_file:
      - ./env/.env.langfuse-worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

      redis:
        condition: service_healthy

      clickhouse:
        condition: service_healthy

    environment:
      HOSTNAME: "0.0.0.0"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3030/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - backend


  # ==========================================================
  # Langfuse Web
  # Provides the Langfuse UI and HTTP API.
  # ==========================================================
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4

    env_file:
      - ./env/.env.langfuse-web

    ports:
      - "127.0.0.1:3001:3000"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

      redis:
        condition: service_healthy

      clickhouse:
        condition: service_healthy

    environment:
      HOSTNAME: "0.0.0.0"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - backend


  # ==========================================================
  # PostgreSQL
  # Stores Langfuse application state and relational metadata.
  # ==========================================================
  postgres:
    image: docker.io/postgres:17

    env_file:
      - ./env/.env.langfuse-postgres

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres",
        ]
      interval: 3s
      timeout: 3s
      retries: 10

    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

    networks:
      - backend


  # ==========================================================
  # ClickHouse
  # Stores high-volume Langfuse observability data.
  # ==========================================================
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12

    env_file:
      - ./env/.env.langfuse-clickhouse

    user: "101:101"

    restart: unless-stopped

    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

    networks:
      - backend


  # ==========================================================
  # Redis
  # Used for caching and background job queues.
  # ==========================================================
  redis:
    image: docker.io/redis:7

    env_file:
      - ./env/.env.langfuse-redis

    command:
      [
        "sh",
        "-c",
        "redis-server --requirepass \"$${REDIS_AUTH}\" --maxmemory-policy noeviction",
      ]

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_AUTH}\" ping",
        ]
      interval: 3s
      timeout: 10s
      retries: 10

    volumes:
      - langfuse_redis_data:/data

    networks:
      - backend


  # ==========================================================
  # MinIO
  # Provides S3-compatible object storage for Langfuse.
  # ==========================================================
  minio:
    image: cgr.dev/chainguard/minio

    entrypoint: sh

    command:
      - -c
      - >
        mkdir -p /data/langfuse &&
        minio server
        --address ":9000"
        --console-address ":9001"
        /data

    env_file:
      - ./env/.env.langfuse-minio

    restart: unless-stopped

    ports:
      - "127.0.0.1:9091:9000"
      - "127.0.0.1:9092:9001"

    volumes:
      - langfuse_minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local",
        ]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

    networks:
      - backend

  # ==========================================================
  # Qdrant readiness gate
  # The Qdrant image does not need an extra curl installation.
  # This short-lived Python container polls Qdrant's health endpoint.
  # ==========================================================
  qdrant-ready:
    image: python:3.11-slim-bookworm
    command:
      - python
      - -c
      - |
        import sys
        import time
        from urllib.request import urlopen

        url = "http://qdrant:6333/readyz"
        deadline = time.monotonic() + 180

        while time.monotonic() < deadline:
            try:
                with urlopen(url, timeout=3) as response:
                    if response.status == 200:
                        print("Qdrant is ready.", flush=True)
                        sys.exit(0)
            except Exception:
                pass
            time.sleep(2)

        print("Qdrant did not become ready within 180 seconds.", flush=True)
        sys.exit(1)
    depends_on:
      qdrant:
        condition: service_started
    restart: "no"
    read_only: true
    user: "10001:10001"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    networks:
      - backend


  # ==========================================================
  # Ollama readiness gate
  # Docker Desktop exposes the host as host.docker.internal.
  # OLLAMA_BASE_URL_DOCKER is the native Ollama URL, without /v1.
  # ==========================================================
  ollama-ready:
    image: python:3.11-slim-bookworm
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - python
      - -c
      - |
        import os
        import sys
        import time
        from urllib.request import urlopen

        base = os.environ["OLLAMA_BASE_URL"].rstrip("/")
        url = base + "/api/tags"
        deadline = time.monotonic() + 180

        while time.monotonic() < deadline:
            try:
                with urlopen(url, timeout=3) as response:
                    if response.status == 200:
                        print("Ollama API is ready.", flush=True)
                        sys.exit(0)
            except Exception:
                pass
            time.sleep(2)

        print("Ollama did not become reachable within 180 seconds.", flush=True)
        sys.exit(1)
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    networks:
      - backend


  # ==========================================================
  # Egyptian Civil Code RAG API
  # ==========================================================
  rag-api:
    image: qanun-masr-rag-api:local

    build:
      context: ..
      dockerfile: docker/Dockerfile

    env_file:
      - ./env/.env.app
    environment:
      MONGODB_URL: ${MONGODB_URL_DOCKER:?MONGODB_URL_DOCKER must be set in the project .env}
      QDRANT_URL: "http://qdrant:6333"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_SECURE: "false"
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL_DOCKER:-http://langfuse-web:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}

    ports:
      - "127.0.0.1:8001:8001"

    depends_on:
      mongo:
        condition: service_healthy
      qdrant-ready:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
      langfuse-worker:
        condition: service_healthy
      ollama-ready:
        condition: service_completed_successfully

    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    networks:
      - backend


# ==========================================================
# Networks
# ==========================================================

  # ==========================================================
  # Optional Locust load testing
  # Start explicitly with: make load-test
  # ==========================================================
  locust:
    image: locustio/locust:2.46.7
    profiles:
      - loadtest
    command:
      - -f
      - /mnt/locust/locustfile.py
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8089"
      - --host
      - http://rag-api:8001
    environment:
      LOCUST_PROJECT_ID: "${LOCUST_PROJECT_ID:-1}"
    volumes:
      - ./loadtest/locustfile.py:/mnt/locust/locustfile.py:ro
    ports:
      - "127.0.0.1:8089:8089"
    depends_on:
      rag-api:
        condition: service_healthy
    restart: "no"
    init: true
    networks:
      - backend

networks:
  backend:
  monitoring:


# ==========================================================
# Volumes
# ==========================================================

volumes:
  mongo_data:

  qdrant_data:

  prometheus_data:

  grafana_data:

  langfuse_postgres_data:

  langfuse_clickhouse_data:

  langfuse_clickhouse_logs:

  langfuse_minio_data:

  langfuse_redis_data:
