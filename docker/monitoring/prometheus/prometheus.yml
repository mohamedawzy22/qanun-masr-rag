global:
  scrape_interval: 15s
  evaluation_interval: 15s


scrape_configs:
  # ----------------------------------------------------------
  # Prometheus
  # ----------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"


  # ----------------------------------------------------------
  # Qdrant
  # ----------------------------------------------------------
  - job_name: "qdrant"
    metrics_path: /metrics

    static_configs:
      - targets:
          - "qdrant:6333"


  # ----------------------------------------------------------
  # RAG FastAPI application
  # ----------------------------------------------------------
  - job_name: "qanun-masr-rag"
    metrics_path: /metrics/

    static_configs:
      - targets:
          - "host.docker.internal:8001"